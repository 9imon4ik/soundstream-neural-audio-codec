defaults:
  - writer: cometml
  - metrics: soundstream
  - datasets: librispeech
  - dataloader: soundstream
  - _self_


generator:
  _target_: src.model.generator.SoundStreamGenerator
  strides: [2, 4, 5, 5]
  hidden_channels: 32
  embedding_dim: 128
  residual_dilations: [1, 3, 9]
  encoder:
    input_kernel_size: 7
    residual_kernel_size: 7
    output_kernel_size: 3
  decoder:
    input_kernel_size: 7
    residual_kernel_size: 7
    output_kernel_size: 7
  quantizer:
    num_quantizers: 8
    codebook_size: 1024
    kmeans_iters: 10
    decay: 0.99
    dead_code_threshold: 2

discriminator:
  _target_: src.model.discriminator.SoundStreamDiscriminator

generator_optimizer:
  _target_: torch.optim.Adam
  lr: 2e-4

discriminator_optimizer:
  _target_: torch.optim.Adam
  lr: 2e-4

generator_loss_function:
  _target_: src.loss.generator_loss.SoundStreamGeneratorLoss
  lambda_adv: 1.0
  lambda_feat: 100.0
  lambda_rec: 1.0
  lambda_com: 1.0

discriminator_loss_function:
  _target_: src.loss.discriminator_loss.SoundStreamDiscriminatorLoss

trainer:
  seed: 1
  device: auto
  log_step: 50
  n_epochs: 100
  epoch_len: 450
  device_tensors: ["audio"]
  resume_from: null
  override: false
  monitor: "off"
  save_period: 5
  early_stop: ${trainer.n_epochs}
  save_dir: "saved"

data:
  train_root: "data/LibriSpeech/LibriSpeech/train-clean-100"
  test_root: "data/LibriSpeech/LibriSpeech/test-clean"

audio:
  sample_rate: 16000
  crop_seconds: 0.5
  channels: 1
